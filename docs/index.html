symbol + \"%{y:,.2f}<extra></extra>\",\n        )\n    )\n\n    fig.update_layout(\n        title=dict(text=\"Daily & Cumulative Spending Trend\", font=dict(size=18)),\n        xaxis=dict(title=\"Date\"),\n        yaxis=dict(title=f\"Amount ({currency_symbol})\"),\n        legend=dict(orientation=\"h\", yanchor=\"bottom\", y=-0.25, xanchor=\"center\", x=0.5),\n        margin=dict(t=50, b=50, l=40, r=20),\n        height=380,\n    )\n    return fig\n\n\ndef create_budget_progress_chart(\n    budget_analysis_df: pd.DataFrame,\n    currency_symbol: str = \"$\"\n) -> Optional[go.Figure]:\n    \"\"\"\n    Creates horizontal comparison bars for Budget vs Actual Spent.\n    \"\"\"\n    if budget_analysis_df.empty:\n        return None\n\n    df = budget_analysis_df.copy()\n    # Reverse so top item displays at the top of horizontal chart\n    df = df.iloc[::-1].reset_index(drop=True)\n\n    fig = go.Figure()\n\n    # Budget bar\n    fig.add_trace(\n        go.Bar(\n            y=df[\"Category\"],\n            x=df[\"Budget\"],\n            name=\"Budget\",\n            orientation=\"h\",\n            marker_color=\"#95A5A6\",\n            opacity=0.5,\n            hovertemplate=\"<b>Budget</b>: \" + currency_symbol + \"%{x:,.2f}<extra></extra>\",\n        )\n    )\n\n    # Actual Spent bar\n    spent_colors = []\n    for status in df[\"Status\"]:\n        if status == \"Exceeded\":\n            spent_colors.append(\"#E74C3C\")  # Red\n        elif status == \"Warning\":\n            spent_colors.append(\"#F39C12\")  # Amber\n        else:\n            spent_colors.append(\"#2ECC71\")  # Green\n\n    fig.add_trace(\n        go.Bar(\n            y=df[\"Category\"],\n            x=df[\"Spent\"],\n            name=\"Actual Spent\",\n            orientation=\"h\",\n            marker_color=spent_colors,\n            hovertemplate=\"<b>Spent</b>: \" + currency_symbol + \"%{x:,.2f}<extra></extra>\",\n        )\n    )\n\n    fig.update_layout(\n        title=dict(text=\"Budget vs Actual Spending by Category\", font=dict(size=18)),\n        barmode=\"group\",\n        xaxis=dict(title=f\"Amount ({currency_symbol})\"),\n        yaxis=dict(title=\"Category\"),\n        legend=dict(orientation=\"h\", yanchor=\"bottom\", y=-0.2, xanchor=\"center\", x=0.5),\n        margin=dict(t=50, b=40, l=100, r=20),\n        height=max(350, len(df) * 45),\n    )\n    return fig\n\n\ndef create_payment_method_chart(\n    payment_df: pd.DataFrame,\n    currency_symbol: str = \"$\"\n) -> Optional[go.Figure]:\n    \"\"\"\n    Creates a breakdown of expenses by payment method.\n    \"\"\"\n    if payment_df.empty:\n        return None\n\n    fig = px.bar(\n        payment_df,\n        x=\"Payment_Method\",\n        y=\"Total\",\n        color=\"Payment_Method\",\n        text=\"Total\",\n        color_discrete_sequence=COLOR_PALETTE,\n        title=\"Expenses by Payment Method\"\n    )\n\n    fig.update_traces(\n        texttemplate=currency_symbol + \"%{text:,.0f}\",\n        textposition=\"outside\",\n        hovertemplate=\"<b>%{x}</b>: \" + currency_symbol + \"%{y:,.2f}<extra></extra>\"\n    )\n\n    fig.update_layout(\n        xaxis=dict(title=\"Payment Method\"),\n        yaxis=dict(title=f\"Total Spent ({currency_symbol})\"),\n        showlegend=False,\n        margin=dict(t=50, b=40, l=40, r=20),\n        height=360,\n    )\n    return fig\n\n\n# ==========================================\n# Matplotlib Static Figures\n# ==========================================\n\ndef create_matplotlib_category_pie(\n    cat_df: pd.DataFrame,\n    currency_symbol: str = \"$\"\n) -> plt.Figure:\n    \"\"\"\n    Generates a clean Matplotlib figure for category-wise expense breakdown.\n    \"\"\"\n    fig, ax = plt.subplots(figsize=(7, 5), dpi=100)\n    if cat_df.empty or \"Total\" not in cat_df.columns:\n        ax.text(0.5, 0.5, \"No expense data to display\", ha=\"center\", va=\"center\", fontsize=12)\n        ax.axis(\"off\")\n        return fig\n\n    # Take top 6 categories, group remainder into 'Other' if more than 6\n    if len(cat_df) > 6:\n        top_cats = cat_df.iloc[:5].copy()\n        other_sum = cat_df.iloc[5:][\"Total\"].sum()\n        other_row = pd.DataFrame([{\"Category\": \"Other Categories\", \"Total\": other_sum}])\n        plot_df = pd.concat([top_cats, other_row], ignore_index=True)\n    else:\n        plot_df = cat_df.copy()\n\n    colors = [CATEGORY_COLORS.get(c, COLOR_PALETTE[i % len(COLOR_PALETTE)]) \n              for i, c in enumerate(plot_df[\"Category\"])]\n\n    wedges, texts, autotexts = ax.pie(\n        plot_df[\"Total\"],\n        labels=plot_df[\"Category\"],\n        autopct=\"%1.1f%%\",\n        startangle=140,\n        colors=colors,\n        wedgeprops=dict(width=0.45, edgecolor=\"white\", linewidth=1.5),\n        pctdistance=0.75,\n    )\n\n    for autotext in autotexts:\n        autotext.set_color(\"black\")\n        autotext.set_fontsize(9)\n        autotext.set_weight(\"bold\")\n\n    for text in texts:\n        text.set_fontsize(10)\n\n    ax.set_title(\"Expense Distribution (Matplotlib)\", fontsize=13, weight=\"bold\", pad=15)\n    plt.tight_layout()\n    return fig\n\n\ndef create_matplotlib_trend_chart(\n    monthly_df: pd.DataFrame,\n    currency_symbol: str = \"$\"\n) -> plt.Figure:\n    \"\"\"\n    Generates a Matplotlib monthly comparison figure.\n    \"\"\"\n    fig, ax = plt.subplots(figsize=(8, 4.5), dpi=100)\n    if monthly_df.empty:\n        ax.text(0.5, 0.5, \"No monthly data to display\", ha=\"center\", va=\"center\", fontsize=12)\n        ax.axis(\"off\")\n        return fig\n\n    months = monthly_df[\"Month_Year\"]\n    x = range(len(months))\n    width = 0.35\n\n    ax.bar([i - width/2 for i in x], monthly_df[\"Income\"], width=width, label=\"Income\", color=\"#2ECC71\", alpha=0.9)\n    ax.bar([i + width/2 for i in x], monthly_df[\"Expense\"], width=width, label=\"Expense\", color=\"#E74C3C\", alpha=0.9)\n\n    ax.plot(x, monthly_df[\"Net_Savings\"], color=\"#3498DB\", marker=\"o\", linewidth=2, label=\"Net Savings\")\n\n    ax.set_xticks(list(x))\n    ax.set_xticklabels(months, rotation=35, ha=\"right\")\n    ax.set_ylabel(f\"Amount ({currency_symbol})\")\n    ax.set_title(\"Monthly Financial Overview (Matplotlib)\", fontsize=13, weight=\"bold\")\n    ax.legend(loc=\"upper left\")\n    ax.grid(axis=\"y\", linestyle=\"--\", alpha=0.5)\n\n    plt.tight_layout()\n    return fig\n", "sample_data.py": "\"\"\"\nSample data generation module for Personal Expense Tracker.\nSeeds realistic transactions, income, and budgets across recent months for immediate demo and testing.\n\"\"\"\n\nfrom datetime import date, timedelta\nimport random\nimport database\n\n\ndef has_sample_data() -> bool:\n    \"\"\"\n    Checks if there are any transactions currently in the database.\n    \"\"\"\n    df = database.get_transactions(limit=1)\n    return not df.empty\n\n\ndef seed_sample_data(force: bool = False) -> int:\n    \"\"\"\n    Seeds the database with realistic sample transactions and budgets for demonstration.\n    Returns the number of transactions inserted.\n    \"\"\"\n    database.init_db()\n\n    if not force and has_sample_data():\n        return 0\n\n    today = date.today()\n    current_year = today.year\n    current_month = today.month\n\n    # Sample transaction templates (Category, Type, min_amt, max_amt, methods, sample descriptions)\n    templates = [\n        # Incomes\n        (\"Salary\", \"Income\", 4500.0, 5500.0, [\"Bank Transfer\"], [\"Monthly Tech Company Salary\", \"Direct Deposit Payroll\"]),\n        (\"Freelance\", \"Income\", 400.0, 1200.0, [\"Bank Transfer\", \"UPI\"], [\"Website Design Client Payment\", \"Python Script Consulting\", \"Technical Writing\"]),\n        (\"Investment\", \"Income\", 150.0, 600.0, [\"Bank Transfer\"], [\"Dividend Payout\", \"Stock Profit Booking\", \"Bond Yield Return\"]),\n\n        # Expenses\n        (\"Food\", \"Expense\", 15.0, 120.0, [\"Credit Card\", \"Debit Card\", \"UPI\", \"Cash\"], [\"Grocery Supermarket Haul\", \"Italian Dinner with Friends\", \"Daily Starbucks Coffee\", \"Organic Farm Produce\", \"Office Lunch Delivery\"]),\n        (\"Travel\", \"Expense\", 20.0, 180.0, [\"Credit Card\", \"UPI\", \"Digital Wallet\"], [\"Uber Ride to Airport\", \"Metro Pass Renewal\", \"Gas Station Refuel\", \"Train Ticket Weekend Trip\"]),\n        (\"Shopping\", \"Expense\", 30.0, 250.0, [\"Credit Card\", \"Debit Card\", \"Digital Wallet\"], [\"New Running Shoes\", \"Amazon Home Electronics\", \"Clothing & Apparel\", \"Books & Stationery\"]),\n        (\"Education\", \"Expense\", 40.0, 300.0, [\"Credit Card\", \"Bank Transfer\"], [\"Online Data Science Course\", \"Professional Certification Fee\", \"O'Reilly Book Subscription\", \"Language Learning App\"]),\n        (\"Bills\", \"Expense\", 45.0, 220.0, [\"Bank Transfer\", \"UPI\", \"Credit Card\"], [\"High-Speed Fiber Internet\", \"Electric Utility Bill\", \"Water & Trash Service\", \"Mobile Postpaid Plan\"]),\n        (\"Healthcare\", \"Expense\", 25.0, 190.0, [\"Credit Card\", \"Debit Card\", \"Cash\"], [\"Monthly Pharmacy Prescription\", \"Dental Checkup & Cleaning\", \"Gym Membership\", \"Multivitamins and Supplements\"]),\n        (\"Entertainment\", \"Expense\", 15.0, 95.0, [\"Credit Card\", \"Digital Wallet\", \"UPI\"], [\"Netflix & Spotify Subscription\", \"IMAX Movie Tickets & Popcorn\", \"Steam Video Game Purchase\", \"Concert Entry Ticket\"]),\n        (\"Other\", \"Expense\", 10.0, 75.0, [\"Cash\", \"UPI\"], [\"Dry Cleaning Service\", \"Apartment Plant Care\", \"Postage & Packaging\", \"Charity Donation\"]),\n    ]\n\n    inserted_count = 0\n\n    # Generate data spanning past 60 days up to today\n    random.seed(42)  # For reproducible realistic data\n\n    for day_offset in range(60, -1, -1):\n        trans_date = today - timedelta(days=day_offset)\n        date_str = trans_date.strftime(\"%Y-%m-%d\")\n\n        # 1. Monthly salary on the 1st or 28th\n        if trans_date.day == 1:\n            database.add_transaction(\n                trans_type=\"Income\",\n                amount=5000.0,\n                category=\"Salary\",\n                date_str=date_str,\n                payment_method=\"Bank Transfer\",\n                description=\"Monthly Company Salary\"\n            )\n            inserted_count += 1\n\n        # 2. Occasional freelance or investment income (twice a month)\n        if trans_date.day in (10, 22):\n            income_sample = random.choice([t for t in templates if t[1] == \"Income\" and t[0] != \"Salary\"])\n            amt = round(random.uniform(income_sample[2], income_sample[3]), 2)\n            method = random.choice(income_sample[4])\n            desc = random.choice(income_sample[5])\n            database.add_transaction(\n                trans_type=\"Income\",\n                amount=amt,\n                category=income_sample[0],\n                date_str=date_str,\n                payment_method=method,\n                description=desc\n            )\n            inserted_count += 1\n\n        # 3. Daily or semi-daily expenses (1 to 3 expenses per day)\n        num_expenses = random.choices([1, 2, 3], weights=[0.4, 0.45, 0.15])[0]\n        expense_templates = [t for t in templates if t[1] == \"Expense\"]\n\n        for _ in range(num_expenses):\n            # Weighted choice: Food and Bills more frequent\n            chosen = random.choice(expense_templates)\n            amt = round(random.uniform(chosen[2], chosen[3]), 2)\n            method = random.choice(chosen[4])\n            desc = random.choice(chosen[5])\n\n            database.add_transaction(\n                trans_type=\"Expense\",\n                amount=amt,\n                category=chosen[0],\n                date_str=date_str,\n                payment_method=method,\n                description=desc\n            )\n            inserted_count += 1\n\n    # Seed Budgets for current month and previous month\n    months_to_budget = [current_month]\n    prev_month = current_month - 1 if current_month > 1 else 12\n    prev_year = current_year if current_month > 1 else current_year - 1\n    \n    budget_targets = [\n        (current_month, current_year),\n        (prev_month, prev_year)\n    ]\n\n    for m, y in budget_targets:\n        database.set_budget(m, y, \"Total\", 2800.0)\n        database.set_budget(m, y, \"Food\", 650.0)\n        database.set_budget(m, y, \"Travel\", 300.0)\n        database.set_budget(m, y, \"Shopping\", 400.0)\n        database.set_budget(m, y, \"Education\", 250.0)\n        database.set_budget(m, y, \"Bills\", 450.0)\n        database.set_budget(m, y, \"Healthcare\", 250.0)\n        database.set_budget(m, y, \"Entertainment\", 200.0)\n\n    return inserted_count\n"};
